<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ULTRON | Next-Gen AI</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Markdown & Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #131314;
      --bg-sidebar: #1e1f20;
      --bg-card: #282a2c;
      --bg-card-hover: #333537;
      --bg-input: #1e1f20;
      --border-color: #444746;
      --border-subtle: #2f3032;
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
      --accent-blue: #4a90e2;
      --accent-purple: #a855f7;
      --gradient-brand: linear-gradient(135deg, #4da9ff 0%, #9d6fff 50%, #ff68b4 100%);
      --user-bubble: #2b2d30;
      --sidebar-w: 280px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', 'Google Sans', system-ui, -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      font-size: 15px;
      line-height: 1.6;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #333537;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #444746;
    }

    /* Layout */
    #app {
      display: flex;
      width: 100vw;
      height: 100%;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-subtle);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a1c;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      width: 100%;
      transition: all 0.2s;
    }
    .new-chat-btn:hover {
      background: #2b2d30;
      border-color: var(--border-color);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 12px 8px 6px 8px;
      font-weight: 600;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text-main);
      transition: background 0.15s ease;
      position: relative;
    }
    .history-item:hover, .history-item.active {
      background: #282a2c;
    }
    .history-item.active {
      font-weight: 500;
      border-left: 3px solid var(--accent-blue);
      border-radius: 4px 12px 12px 4px;
    }
    .history-item-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }
    .history-actions {
      display: none;
      align-items: center;
      gap: 4px;
    }
    .history-item:hover .history-actions,
    .history-item.active .history-actions {
      display: flex;
    }
    .icon-btn-subtle {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn-subtle:hover {
      color: #fff;
      background: #3c4043;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-main);
    }

    /* Top Bar */
    .top-bar {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      background: rgba(19, 19, 20, 0.85);
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-container {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      overflow: hidden;
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-name {
      font-weight: 700;
      font-size: 18px;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    .model-badge {
      font-size: 11.5px;
      background: #1e1f20;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    /* Chat Messages Box */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      scroll-behavior: smooth;
    }
    .chat-inner {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding-bottom: 20px;
    }

    /* Welcome / Greeting Screen */
    .welcome-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      margin-top: 4vh;
      width: 100%;
      animation: fadeIn 0.4s ease-out;
    }
    .welcome-title {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .welcome-gradient {
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 36px;
    }
    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      width: 100%;
    }
    .suggestion-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-subtle);
      padding: 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 120px;
    }
    .suggestion-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-color);
      transform: translateY(-2px);
    }
    .suggestion-card p {
      font-size: 13.5px;
      color: var(--text-main);
      font-weight: 500;
    }
    .suggestion-card .card-icon {
      align-self: flex-end;
      color: var(--accent-blue);
      margin-top: 12px;
    }

    /* Messages */
    .message-row {
      display: flex;
      width: 100%;
      gap: 16px;
      animation: messageSlideIn 0.25s ease-out;
    }
    .message-row.user-row {
      justify-content: flex-end;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #2b2d30;
      color: #fff;
    }
    .avatar.ai-avatar {
      background: var(--gradient-brand);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .bubble-wrapper {
      max-width: 85%;
      display: flex;
      flex-direction: column;
    }
    .user-bubble {
      background-color: var(--user-bubble);
      color: #f0f0f0;
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ai-bubble {
      width: 100%;
      color: var(--text-main);
      font-size: 15px;
      word-break: break-word;
    }

    /* Markdown Styles */
    .ai-bubble p {
      margin-bottom: 14px;
    }
    .ai-bubble p:last-child {
      margin-bottom: 0;
    }
    .ai-bubble h1, .ai-bubble h2, .ai-bubble h3, .ai-bubble h4 {
      color: #fff;
      margin: 18px 0 8px 0;
      font-weight: 600;
    }
    .ai-bubble ul, .ai-bubble ol {
      margin: 8px 0 14px 24px;
    }
    .ai-bubble li {
      margin-bottom: 4px;
    }
    .ai-bubble blockquote {
      border-left: 3px solid var(--accent-blue);
      padding-left: 12px;
      color: var(--text-muted);
      margin: 12px 0;
    }
    .ai-bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 14px;
    }
    .ai-bubble th, .ai-bubble td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }
    .ai-bubble th {
      background: #1e1f20;
    }

    /* Code Blocks */
    .code-container {
      position: relative;
      background: #18191a;
      border: 1px solid #2f3032;
      border-radius: 8px;
      margin: 14px 0;
      overflow: hidden;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #212224;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .copy-btn:hover {
      background: #333537;
      color: #fff;
    }
    pre code.hljs {
      padding: 12px 16px;
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      overflow-x: auto;
      display: block;
    }
    :not(pre) > code {
      background: #252628;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #e599f7;
    }

    /* Error Notification */
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }

    /* Input Dock */
    .input-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 20px 16px;
      background: linear-gradient(180deg, transparent 0%, var(--bg-main) 40%);
      z-index: 10;
    }
    .input-dock {
      width: 100%;
      max-width: 820px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 8px 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s;
    }
    .input-dock:focus-within {
      border-color: #6366f1;
    }
    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      padding: 8px 6px;
      max-height: 180px;
      min-height: 24px;
      line-height: 1.45;
    }
    .action-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .action-btn:hover:not(:disabled) {
      background: #2b2d30;
      color: #fff;
    }
    .send-btn {
      background: #fff;
      color: #000;
    }
    .send-btn:hover:not(:disabled) {
      background: #e2e2e2;
      color: #000;
    }
    .send-btn:disabled {
      background: #2e3032;
      color: #666;
      cursor: not-allowed;
    }
    .input-disclaimer {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }
    .modal-overlay.open .modal-card {
      transform: scale(1);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      background: #141415;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--accent-blue);
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13.5px;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #282a2c;
    }
    .btn-primary {
      background: #fff;
      border: none;
      color: #000;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: #e2e2e2;
    }

    /* Mobile Drawer */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 40;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      vertical-align: baseline;
      color: var(--accent-blue);
      animation: blink 0.8s infinite;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .sidebar-overlay.active {
        display: block;
      }
    }
  </style>
  </head><body>

  <div id="app">
    <!-- Sidebar backdrop for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" onclick="createNewChat()">
          <i data-lucide="plus" style="width: 18px; height: 18px;"></i>
          <span>New chat</span>
        </button>
      </div>

      <div class="history-title">Recent Conversations</div>
      <div class="history-list" id="history-list">
        <!-- Rendered chats -->
      </div>

      <div class="sidebar-footer">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="avatar" style="width: 28px; height: 28px; font-size: 12px; background: #374151;">
            <i data-lucide="user" style="width: 16px; height: 16px;"></i>
          </div>
          <span style="font-size: 13px; font-weight: 500;">Local User</span>
        </div>
        <button class="icon-btn-subtle" onclick="openConfigModal()" title="Settings">
          <i data-lucide="settings" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="brand-section">
          <button class="icon-btn-subtle" id="menu-btn" onclick="toggleSidebar()" style="margin-right: 4px;">
            <i data-lucide="menu" style="width: 20px; height: 20px;"></i>
          </button>
          <div class="logo-container" id="brand-logo">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 17L12 22L22 17" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12L12 17L22 12" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <defs>
                <linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#4da9ff"/>
                  <stop offset="0.5" stop-color="#9d6fff"/>
                  <stop offset="1" stop-color="#ff68b4"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="brand-name">ULTRON</span>
          <span class="model-badge" id="current-model-tag">gemini-3.6-flash</span>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="icon-btn-subtle" onclick="openConfigModal()" title="Configuration">
            <i data-lucide="sliders" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
      </header>

      <!-- Chat Stream / Greeting Area -->
      <section class="chat-container" id="chat-container">
        <div class="chat-inner" id="chat-inner">
          <!-- Dynamic Content Rendered Here -->
        </div>
      </section>

      <!-- Bottom Input Dock -->
      <footer class="input-section">
        <div class="input-dock">
          <textarea 
            id="chat-input" 
            class="chat-textarea" 
            placeholder="Ask ULTRON anything..." 
            rows="1"
            oninput="autoResize(this)"
            onkeydown="handleKeyDown(event)"
          ></textarea>
          <button id="stop-btn" class="action-btn" onclick="abortGeneration()" style="display: none; color: #ef4444;" title="Stop generation">
            <i data-lucide="square" style="width: 18px; height: 18px; fill: currentColor;"></i>
          </button>
          <button id="send-btn" class="action-btn send-btn" onclick="sendMessage()" title="Send Message">
            <i data-lucide="arrow-up" style="width: 18px; height: 18px;"></i>
          </button>
        </div>
        <div class="input-disclaimer">
          ULTRON may display inaccurate info. Always verify critical insights.
        </div>
      </footer>
    </main>
  </div>

  <!-- Settings / Configuration Modal -->
  <div class="modal-overlay" id="config-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">ULTRON Settings</h2>
        <button class="icon-btn-subtle" onclick="closeConfigModal()">
          <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        </button>
      </div>

      <div class="form-group">
        <label for="cfg-api-key">Gemini API Key</label>
        <input type="text" id="cfg-api-key" class="form-input" placeholder="AIzaSy...">
        <div class="form-hint">Stored purely on device in your browser's LocalStorage.</div>
      </div>

      <div class="form-group">
        <label for="cfg-model">Model Selector</label>
        <select id="cfg-model" class="form-select">
          <option value="gemini-3.6-flash">gemini-3.6-flash (Active & Recommended)</option>
          <option value="gemini-3.5-flash">gemini-3.5-flash</option>
          <option value="gemini-3.7-flash">gemini-3.7-flash</option>
          <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
        </select>
      </div>

      <div class="form-group">
        <label for="cfg-logo-url">Custom Logo URL (Optional)</label>
        <input type="text" id="cfg-logo-url" class="form-input" placeholder="https://example.com/logo.png">
      </div>

      <div class="form-group">
        <label>Upload Custom Logo File</label>
        <input type="file" id="cfg-logo-file" accept="image/*" class="form-input" style="padding: 6px;" onchange="handleFileUpload(event)">
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeConfigModal()">Cancel</button>
        <button class="btn-primary" onclick="saveConfiguration()">Save Settings</button>
      </div>
    </div>
  </div><script>
    /**
     * ULTRON Core Application Script
     */
    const SYSTEM_INSTRUCTION = `You are ULTRON, a sophisticated, adaptive, and highly intelligent AI assistant. 
You provide structured, deeply reasoned, and accurate answers formatted in pristine Markdown.
When writing code, always specify the language for proper syntax highlighting. Be concise, direct, and helpful.`;

    // Global App State
    let state = {
      apiKey: localStorage.getItem('ultron_api_key') || '',
      model: localStorage.getItem('ultron_model') || 'gemini-3.6-flash',
      customLogo: localStorage.getItem('ultron_logo') || '',
      chats: JSON.parse(localStorage.getItem('ultron_chats') || '[]'),
      activeChatId: localStorage.getItem('ultron_active_chat') || null,
      isGenerating: false,
      abortController: null
    };

    // Initialize Markdown and HighlightJS
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      breaks: true
    });

    // Custom renderer for code snippets with copy button
    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
      const validLang = language || 'text';
      const highlighted = hljs.getLanguage(validLang) 
        ? hljs.highlight(code, { language: validLang }).value 
        : hljs.highlightAuto(code).value;
      
      return `
        <div class="code-container">
          <div class="code-header">
            <span>${validLang}</span>
            <button class="copy-btn" onclick="copyCode(this)">
              <i data-lucide="copy" style="width: 12px; height: 12px;"></i>
              <span>Copy</span>
            </button>
          </div>
          <pre><code class="hljs ${validLang}">${highlighted}</code></pre>
        </div>
      `;
    };
    marked.use({ renderer });

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      applyStoredLogo();
      document.getElementById('current-model-tag').innerText = state.model;
      
      if (!state.chats.length) {
        createNewChat();
      } else {
        if (!state.activeChatId || !state.chats.find(c => c.id === state.activeChatId)) {
          state.activeChatId = state.chats[0].id;
        }
        renderHistory();
        renderActiveChat();
      }

      // Check if API key exists; if not, open config
      if (!state.apiKey) {
        openConfigModal();
      }
    });

    // Sidebar Controller
    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      const shouldOpen = forceState !== undefined ? forceState : !sidebar.classList.contains('mobile-open');
      
      sidebar.classList.toggle('mobile-open', shouldOpen);
      overlay.classList.toggle('active', shouldOpen);
    }

    // Auto resize input dock textarea
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';
      
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = !textarea.value.trim() && !state.isGenerating;
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // Chat Session Management
    function createNewChat() {
      const newChat = {
        id: 'chat_' + Date.now(),
        title: 'New chat',
        createdAt: new Date().toISOString(),
        messages: []
      };
      state.chats.unshift(newChat);
      state.activeChatId = newChat.id;
      saveState();
      renderHistory();
      renderActiveChat();
      toggleSidebar(false);
    }

    function switchChat(chatId) {
      if (state.isGenerating) return;
      state.activeChatId = chatId;
      saveState();
      renderHistory();
      renderActiveChat();
      toggleSidebar(false);
    }

    function deleteChat(chatId, e) {
      e.stopPropagation();
      state.chats = state.chats.filter(c => c.id !== chatId);
      if (!state.chats.length) {
        createNewChat();
      } else if (state.activeChatId === chatId) {
        state.activeChatId = state.chats[0].id;
      }
      saveState();
      renderHistory();
      renderActiveChat();
    }

    function renameChat(chatId, e) {
      e.stopPropagation();
      const chat = state.chats.find(c => c.id === chatId);
      if (!chat) return;
      const newTitle = prompt('Enter new conversation title:', chat.title);
      if (newTitle && newTitle.trim()) {
        chat.title = newTitle.trim();
        saveState();
        renderHistory();
      }
    }

    function saveState() {
      localStorage.setItem('ultron_chats', JSON.stringify(state.chats));
      localStorage.setItem('ultron_active_chat', state.activeChatId);
    }

    // History Sidebar Renderer
    function renderHistory() {
      const listContainer = document.getElementById('history-list');
      listContainer.innerHTML = '';

      state.chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `history-item ${chat.id === state.activeChatId ? 'active' : ''}`;
        item.onclick = () => switchChat(chat.id);

        item.innerHTML = `
          <div class="history-item-label">${escapeHtml(chat.title)}</div>
          <div class="history-actions">
            <button class="icon-btn-subtle" onclick="renameChat('${chat.id}', event)" title="Rename">
              <i data-lucide="edit-2" style="width: 14px; height: 14px;"></i>
            </button>
            <button class="icon-btn-subtle" onclick="deleteChat('${chat.id}', event)" title="Delete">
              <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
            </button>
          </div>
        `;
        listContainer.appendChild(item);
      });
      lucide.createIcons();
    }

    // Active Chat Render
    function renderActiveChat() {
      const container = document.getElementById('chat-inner');
      const activeChat = state.chats.find(c => c.id === state.activeChatId);
      
      if (!activeChat || activeChat.messages.length === 0) {
        renderWelcomeScreen(container);
        return;
      }

      container.innerHTML = '';
      activeChat.messages.forEach(msg => {
        appendMessageElement(msg.role, msg.content, false);
      });
      scrollToBottom();
    }

    function renderWelcomeScreen(container) {
      container.innerHTML = `
        <div class="welcome-container">
          <h1 class="welcome-title">
            <span class="welcome-gradient">Hello, I am ULTRON.</span><br>
            How can I help you today?
          </h1>
          <p class="welcome-subtitle">Equipped for deep reasoning, real-time code generation, and complex analysis.</p>
          
          <div class="suggestions-grid">
            <div class="suggestion-card" onclick="sendSuggestion('Write an optimized Python script for asynchronous web scraping with aiohttp.')">
              <p>Write an async Python web scraper with error handling</p>
              <div class="card-icon"><i data-lucide="code" style="width: 18px; height: 18px;"></i></div>
            </div>
            <div class="suggestion-card" onclick="sendSuggestion('Explain the architecture of Transformer Neural Networks and Attention mechanisms.')">
              <p>Explain Transformer architectures & Multi-Head Attention</p>
              <div class="card-icon"><i data-lucide="cpu" style="width: 18px; height: 18px;"></i></div>
            </div>
            <div class="suggestion-card" onclick="sendSuggestion('Draft a complete system architecture for a high-throughput microservice.')">
              <p>System architecture design for scalable microservices</p>
              <div class="card-icon"><i data-lucide="layers" style="width: 18px; height: 18px;"></i></div>
            </div>
            <div class="suggestion-card" onclick="sendSuggestion('Review my code logic for concurrency bugs and performance bottlenecks.')">
              <p>Debug concurrency locks & memory leaks</p>
              <div class="card-icon"><i data-lucide="bug" style="width: 18px; height: 18px;"></i></div>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function sendSuggestion(text) {
      const input = document.getElementById('chat-input');
      input.value = text;
      autoResize(input);
      sendMessage();
    }

    // Message Appending Helper
    function appendMessageElement(role, text, isStreaming = false) {
      const container = document.getElementById('chat-inner');
      const row = document.createElement('div');
      row.className = `message-row ${role === 'user' ? 'user-row' : 'ai-row'}`;

      if (role === 'user') {
        row.innerHTML = `
          <div class="bubble-wrapper">
            <div class="user-bubble">${escapeHtml(text)}</div>
          </div>
        `;
      } else {
        const logoSrc = state.customLogo || '';
        const avatarContent = logoSrc 
          ? `<img src="${logoSrc}" alt="ULTRON">` 
          : `<i data-lucide="bot" style="width: 18px; height: 18px;"></i>`;

        row.innerHTML = `
          <div class="avatar ai-avatar">${avatarContent}</div>
          <div class="bubble-wrapper" style="flex: 1;">
            <div class="ai-bubble ${isStreaming ? 'typing-cursor' : ''}">
              ${marked.parse(text || '')}
            </div>
          </div>
        `;
      }

      container.appendChild(row);
      lucide.createIcons();
      return row;
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-container');
      container.scrollTop = container.scrollHeight;
    }

    // Streaming API Call
    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const messageText = input.value.trim();
      if (!messageText || state.isGenerating) return;

      if (!state.apiKey) {
        openConfigModal();
        return;
      }

      // If active chat is empty, create conversation title from the first prompt
      const currentChat = state.chats.find(c => c.id === state.activeChatId);
      if (currentChat.messages.length === 0) {
        currentChat.title = messageText.slice(0, 32) + (messageText.length > 32 ? '...' : '');
        renderHistory();
      }

      // Add user message
      currentChat.messages.push({ role: 'user', content: messageText });
      saveState();

      input.value = '';
      autoResize(input);

      // Render updated chat
      renderActiveChat();

      // UI state for generation
      setGeneratingState(true);

      // Create streaming placeholder
      const aiRow = appendMessageElement('model', '', true);
      const aiBubble = aiRow.querySelector('.ai-bubble');
      let streamedResponse = '';

      // Prepare Gemini contents payload
      const contentsPayload = currentChat.messages.map(msg => ({
        role: msg.role === 'user' ? 'user' : 'model',
        parts: [{ text: msg.content }]
      }));

      state.abortController = new AbortController();

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${state.model}:streamGenerateContent?alt=sse&key=${state.apiKey}`;
        
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: state.abortController.signal,
          body: JSON.stringify({
            contents: contentsPayload,
            systemInstruction: {
              parts: [{ text: SYSTEM_INSTRUCTION }]
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // keep partial line

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('data: ')) {
              const jsonStr = trimmed.substring(6);
              try {
                const data = JSON.parse(jsonStr);
                const chunkText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                if (chunkText) {
                  streamedResponse += chunkText;
                  aiBubble.innerHTML = marked.parse(streamedResponse);
                  lucide.createIcons();
                  scrollToBottom();
                }
              } catch (parseErr) {
                // Keep streaming despite fragment errors
              }
            }
          }
        }

        // Commit AI message to state
        aiBubble.classList.remove('typing-cursor');
        currentChat.messages.push({ role: 'model', content: streamedResponse });
        saveState();

      } catch (err) {
        if (err.name === 'AbortError') {
          aiBubble.classList.remove('typing-cursor');
          if (streamedResponse) {
            currentChat.messages.push({ role: 'model', content: streamedResponse });
            saveState();
          }
        } else {
          aiBubble.classList.remove('typing-cursor');
          const errorCard = document.createElement('div');
          errorCard.className = 'error-banner';
          errorCard.innerHTML = `
            <i data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink:0;"></i>
            <span><strong>ULTRON Error:</strong> ${escapeHtml(err.message)}</span>
          `;
          aiBubble.appendChild(errorCard);
          lucide.createIcons();
        }
      } finally {
        setGeneratingState(false);
      }
    }

    function abortGeneration() {
      if (state.abortController) {
        state.abortController.abort();
      }
    }

    function setGeneratingState(isGen) {
      state.isGenerating = isGen;
      document.getElementById('send-btn').style.display = isGen ? 'none' : 'flex';
      document.getElementById('stop-btn').style.display = isGen ? 'flex' : 'none';
      document.getElementById('chat-input').disabled = isGen;
      if (!isGen) {
        document.getElementById('chat-input').focus();
      }
    }

    // Modal & Config Management
    function openConfigModal() {
      document.getElementById('cfg-api-key').value = state.apiKey;
      document.getElementById('cfg-model').value = state.model;
      document.getElementById('cfg-logo-url').value = state.customLogo.startsWith('data:') ? '' : state.customLogo;
      document.getElementById('config-modal').classList.add('open');
      lucide.createIcons();
    }

    function closeConfigModal() {
      document.getElementById('config-modal').classList.remove('open');
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          state.customLogo = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function saveConfiguration() {
      const apiKeyInput = document.getElementById('cfg-api-key').value.trim();
      const modelInput = document.getElementById('cfg-model').value;
      const logoUrlInput = document.getElementById('cfg-logo-url').value.trim();

      state.apiKey = apiKeyInput;
      state.model = modelInput;
      if (logoUrlInput) {
        state.customLogo = logoUrlInput;
      }

      localStorage.setItem('ultron_api_key', state.apiKey);
      localStorage.setItem('ultron_model', state.model);
      localStorage.setItem('ultron_logo', state.customLogo);

      document.getElementById('current-model-tag').innerText = state.model;
      applyStoredLogo();
      renderActiveChat();
      closeConfigModal();
    }

    function applyStoredLogo() {
      const container = document.getElementById('brand-logo');
      if (state.customLogo) {
        container.innerHTML = `<img src="${state.customLogo}" alt="Logo">`;
      } else {
        container.innerHTML = `
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="logo-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4da9ff"/>
                <stop offset="0.5" stop-color="#9d6fff"/>
                <stop offset="1" stop-color="#ff68b4"/>
              </linearGradient>
            </defs>
          </svg>
        `;
      }
    }

    // Utilities
    function copyCode(button) {
      const pre = button.closest('.code-container').querySelector('pre code');
      const text = pre.innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalHTML = button.innerHTML;
        button.innerHTML = `<i data-lucide="check" style="width: 12px; height: 12px; color:#4ade80;"></i><span>Copied!</span>`;
        lucide.createIcons();
        setTimeout(() => {
          button.innerHTML = originalHTML;
          lucide.createIcons();
        }, 2000);
      });
    }

    function escapeHtml(string) {
      const div = document.createElement('div');
      div.innerText = string;
      return div.innerHTML;
    }
  </script>
</body>
</html>
